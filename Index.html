<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daffaizan Z.I - Modern Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a40);
      color: #fff;
    }
    header {
      text-align: center;
      padding: 80px 20px;
    }
    header h1 {
      font-size: 3rem;
      margin: 0;
      color: #00d4ff;
    }
    header p {
      font-size: 1.2rem;
      color: #ccc;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #00d4ff;
      color: #0f0f0f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #ff007f;
      color: #fff;
    }
    section {
      padding: 60px 20px;
      text-align: center;
    }
    section h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #ff007f;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>Daffaizan Z.I</h1>
    <p>Portofolio Modern & Kreatif</p>
    <a href="#about" class="btn">Jelajahi</a>
  </header>

  <section id="about">
    <h2>Tentang Saya</h2>
    <p>Saya seorang kreator yang fokus pada coding, desain, dan pengembangan portofolio kreatif.</p>
  </section>

  <section id="projects">
    <h2>Proyek</h2>
    <p>Website, aplikasi, dan desain yang saya buat untuk meningkatkan efisiensi dan kreativitas.</p>
  </section>

  <footer>
    <p>© 2026 Daffaizan Z.I | Dibuat dengan ❤️</p>
  </footer>
</body>
</html>
